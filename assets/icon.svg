<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The Ambrosia mark: a bowl of ambrosia, heaped in three scoops of honey,
       with a spoon standing in it. Same shapes as the shell's "bowl" icon. -->
  <defs>
    <linearGradient id="h" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f7bd4a"/><stop offset="1" stop-color="#e9783a"/></linearGradient>
  </defs>
  <g transform="translate(0.2 3.6) scale(2.6)" stroke="#c9763c" stroke-width="0.9" stroke-linejoin="round">
    <path d="M17.25 10.21L22.05 3.51A1.05 1.05 0 0 0 20.35 2.29L15.55 8.99A1.05 1.05 0 0 0 17.25 10.21Z" fill="#f8ecd8"/>
    <!-- the heap's outline: a wide stroke under the fill, so only its outer edge shows -->
    <path id="s" d="M3.2 11.4a2.9 2.9 0 1 0 5.8 0a2.9 2.9 0 1 0 -5.8 0zM6.8 9.5a3.7 3.7 0 1 0 7.4 0a3.7 3.7 0 1 0 -7.4 0zM12 11.3a2.9 2.9 0 1 0 5.8 0a2.9 2.9 0 1 0 -5.8 0z" stroke-width="1.8"/>
    <use href="#s" fill="url(#h)" stroke="none"/>
    <path d="M18.6 12.4H2.4A8.1 7.2 0 0 0 18.6 12.4Z" fill="#f8ecd8"/>
    <path d="M4.6 14.2c0.6 1.6 1.7 2.8 3.2 3.6" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>
  </g>
</svg>
