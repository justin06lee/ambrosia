<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="t">
  <title id="t">ambrosia</title>
  <!-- A glass bowl of ambrosia, heaped in three scoops of honey, with a
       spoon standing in it: the glass of the shell and the honey of the house
       color. The bowl's lens magnifies the light behind it. -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8ecd8"/>
      <stop offset="1" stop-color="#f2d5c3"/>
    </linearGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7bd4a"/>
      <stop offset="1" stop-color="#e9783a"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="frame"><rect x="8" y="8" width="464" height="304" rx="28"/></clipPath>
    <!-- The shell's "bowl" icon, 24 units, drawn at 7.2x around the center. -->
    <path id="bowl" d="M18.6 12.4H2.4A8.1 7.2 0 0 0 18.6 12.4Z"/>
    <path id="scoops" d="M3.2 11.4a2.9 2.9 0 1 0 5.8 0a2.9 2.9 0 1 0 -5.8 0zM6.8 9.5a3.7 3.7 0 1 0 7.4 0a3.7 3.7 0 1 0 -7.4 0zM12 11.3a2.9 2.9 0 1 0 5.8 0a2.9 2.9 0 1 0 -5.8 0z"/>
    <path id="spoon" d="M17.25 10.21L22.05 3.51A1.05 1.05 0 0 0 20.35 2.29L15.55 8.99A1.05 1.05 0 0 0 17.25 10.21Z"/>
    <clipPath id="glass"><use href="#bowl" transform="translate(152 64.9) scale(7.2)"/></clipPath>
    <g id="light">
      <circle cx="132" cy="96" r="74" fill="#f6bd52" opacity="0.55"/>
      <circle cx="372" cy="82" r="84" fill="#98b4f2" opacity="0.5"/>
      <circle cx="352" cy="252" r="72" fill="#f0897f" opacity="0.4"/>
      <circle cx="116" cy="248" r="64" fill="#c495e8" opacity="0.45"/>
      <circle cx="244" cy="150" r="46" fill="#f5ad5d" opacity="0.35"/>
    </g>
  </defs>

  <rect x="8" y="8" width="464" height="304" rx="28" fill="url(#card)"/>
  <g clip-path="url(#frame)" filter="url(#soft)"><use href="#light"/></g>

  <!-- shadow -->
  <ellipse cx="240" cy="210" rx="52" ry="6" fill="#a8582c" opacity="0.16"/>

  <!-- spoon and scoops, behind the bowl's rim -->
  <g transform="translate(152 64.9) scale(7.2)">
    <use href="#spoon" fill="#fbf4ea" stroke="#fff" stroke-width="0.32"/>
    <use href="#scoops" fill="url(#honey)"/>
    <path d="M5.2 9.4a2.2 2.2 0 0 1 2.3 -1.2M9.2 7a3 3 0 0 1 2.9 -1.1" fill="none" stroke="#fff" stroke-width="0.42" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- the bowl: the same light, magnified, inside the glass -->
  <g clip-path="url(#glass)">
    <g filter="url(#soft)" transform="translate(240 180) scale(1.35) translate(-240 -180)"><use href="#light"/></g>
    <rect x="160" y="150" width="160" height="70" fill="#fff" opacity="0.3"/>
  </g>

  <!-- rim and specular -->
  <g transform="translate(152 64.9) scale(7.2)" fill="none" stroke="#fff" stroke-linecap="round">
    <use href="#bowl" stroke-width="0.35" opacity="0.9"/>
    <path d="M4.4 14.3c0.7 1.7 1.9 3 3.5 3.8" stroke-width="0.8" opacity="0.85"/>
  </g>
  <circle cx="190" cy="174" r="3.5" fill="#fff" opacity="0.85"/>

  <text x="240" y="272" text-anchor="middle" fill="#2b2420"
    font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="40" font-weight="600" letter-spacing="-1">ambrosia</text>
</svg>
