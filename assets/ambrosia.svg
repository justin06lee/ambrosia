<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="t">
  <title id="t">ambrosia</title>
  <!-- A glass drop holding a little nectar: the glass of the shell and the
       honey of the house color. The drop's lens magnifies the light behind it. -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8ecd8"/>
      <stop offset="1" stop-color="#f2d5c3"/>
    </linearGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7bd4a"/>
      <stop offset="1" stop-color="#e9783a"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="26"/></filter>
    <clipPath id="frame"><rect x="8" y="8" width="464" height="304" rx="28"/></clipPath>
    <clipPath id="drop">
      <path d="M240 46c22 30 54 66 54 106a54 54 0 0 1-108 0c0-40 32-76 54-106z"/>
    </clipPath>
    <g id="light">
      <circle cx="132" cy="96" r="74" fill="#f6bd52" opacity="0.55"/>
      <circle cx="372" cy="82" r="84" fill="#98b4f2" opacity="0.5"/>
      <circle cx="352" cy="252" r="72" fill="#f0897f" opacity="0.4"/>
      <circle cx="116" cy="248" r="64" fill="#c495e8" opacity="0.45"/>
      <circle cx="244" cy="150" r="46" fill="#f5ad5d" opacity="0.35"/>
    </g>
  </defs>

  <rect x="8" y="8" width="464" height="304" rx="28" fill="url(#card)"/>
  <g clip-path="url(#frame)" filter="url(#soft)"><use href="#light"/></g>

  <!-- shadow -->
  <ellipse cx="240" cy="214" rx="42" ry="6" fill="#a8582c" opacity="0.16"/>

  <!-- the lens: the same light, magnified, inside the drop -->
  <g clip-path="url(#drop)">
    <g filter="url(#soft)" transform="translate(240 152) scale(1.35) translate(-240 -152)"><use href="#light"/></g>
    <path d="M240 46c22 30 54 66 54 106a54 54 0 0 1-108 0c0-40 32-76 54-106z" fill="#fff" opacity="0.3"/>
    <path d="M180 156c18-9 34 8 56-1s38-10 62 0v60H180z" fill="url(#honey)"/>
    <path d="M180 156c18-9 34 8 56-1s38-10 62 0" fill="none" stroke="#fff" stroke-width="2" opacity="0.55"/>
  </g>

  <!-- rim and specular -->
  <path d="M240 46c22 30 54 66 54 106a54 54 0 0 1-108 0c0-40 32-76 54-106z" fill="none" stroke="#fff" stroke-width="2.5" opacity="0.9"/>
  <path d="M222 92c-9 13-15 27-17 44" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <circle cx="204" cy="152" r="3.5" fill="#fff" opacity="0.85"/>

  <text x="240" y="272" text-anchor="middle" fill="#2b2420"
    font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
    font-size="40" font-weight="600" letter-spacing="-1">ambrosia</text>
</svg>
