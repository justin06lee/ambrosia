# Which program answers each desktop portal in an Ambrosia session
# (xdg-desktop-portal reads the first portals.conf it finds, and the
# session's config folder comes first). Open and Save are Files' own panels
# (ambrosia-files; KDE's dialog where Files isn't installed); the rest stay
# as Plasma has them (/usr/share/xdg-desktop-portal/kde-portals.conf).
[preferred]
default=kde
org.freedesktop.impl.portal.FileChooser=ambrosia;kde
org.freedesktop.impl.portal.Settings=kde;gtk;
org.freedesktop.impl.portal.Secret=kwallet
org.freedesktop.impl.portal.Notification=plasmanotify
