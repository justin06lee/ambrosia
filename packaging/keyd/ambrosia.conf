# Ambrosia's Mac-first keyboard (keyd): Super is Command.
#
# Holding ⌘ gives the app Ctrl, so ⌘C is the Ctrl+C its menus document, in
# every app, and Ctrl itself is left alone. What ⌘ does that isn't Ctrl is
# written out below: the system's own shortcuts (shared by every layer, in
# /usr/share/keyd/ambrosia/) and a Mac's text keys. Terminals get their own
# Command layer, switched in while one has the keyboard (the shell asks; see
# /usr/share/ambrosia/keys/).
#
# Keys are named by where they sit on a US keyboard. After a change:
# `sudo keyd reload`; `keyd check` reads the file for mistakes. Turning the
# layer off altogether (the Linux-first keyboard): `systemctl disable --now keyd`.
#
# On a PC keyboard ⌘ is the Windows key. To have it beside the space bar as
# on a Mac, swap the two by adding, under [main]:
#   leftalt = layer(cmd)
#   leftmeta = layer(opt)

[ids]
*

[main]
meta = layer(cmd)
leftalt = layer(opt)

# ⌘ in every app but a terminal.
[cmd:C]
include ambrosia/command
# ⌘← ⌘→ the line's start and end, ⌘↑ ⌘↓ the document's.
left = home
right = end
up = C-home
down = C-end
# ⌘[ ⌘] back and forward.
leftbrace = A-left
rightbrace = A-right

# ⌥: ⌥← ⌥→ by word, ⌥⌫ and ⌥⌦ delete one. Anything else is Alt.
[opt:A]
left = C-left
right = C-right
backspace = C-backspace
delete = C-delete

[cmd+shift]
include ambrosia/command-shift

[cmd+control]
include ambrosia/command-control

[cmd+opt]
include ambrosia/command-option

# ⌘ in a terminal: Ctrl+Shift, a terminal's own modifier for copy, paste, new
# tab, find and close, so Ctrl+C and the rest of Ctrl stay the shell's.
[cmd_terminal:C-S]
include ambrosia/command
left = home
right = end
# ⌘- makes the text smaller (⌘+ is already Ctrl+Shift+=); ⌘⌫ clears the
# line typed so far.
minus = C-minus
backspace = C-u

# ⌥ in a terminal: its Alt, which shells read as Meta (⌥⌫ deletes a word);
# the arrows and ⌥⌦ as shells bind them.
[opt_terminal:A]
left = C-left
right = C-right
delete = A-d

[cmd_terminal+shift]
include ambrosia/command-shift

[cmd_terminal+control]
include ambrosia/command-control

[cmd_terminal+opt_terminal]
include ambrosia/command-option

# ⌘Tab and ⌘`: KWin's switchers are on Alt, and stay up while it's held, so
# ⌘ becomes Alt until it's let go. In the app switcher ` steps back.
[app_switcher:A]
grave = A-S-tab

[window_switcher:A]
