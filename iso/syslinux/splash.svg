<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 480" width="640" height="480">
  <!-- The installer image's BIOS boot menu: Ambrosia's night wallpaper, the
       mark and the name, and a pane of glass where syslinux lists what to
       start. tools/build-iso.sh renders it to splash.png (640x480, the size
       syslinux's menu draws at). -->
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#1a1430"/>
      <stop offset="1" stop-color="#2a1426"/>
    </linearGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7bd4a"/>
      <stop offset="1" stop-color="#e9783a"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.07"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="48"/></filter>
  </defs>
  <rect width="640" height="480" fill="url(#base)"/>
  <!-- assets/wallpapers/nectar-night.svg's embers, at this size -->
  <g filter="url(#soft)">
    <ellipse cx="95" cy="78" rx="180" ry="129" fill="#b8641f"/>
    <ellipse cx="538" cy="75" rx="195" ry="141" fill="#2d3c94"/>
    <ellipse cx="330" cy="264" rx="230" ry="114" fill="#7c2a55"/>
    <ellipse cx="90" cy="414" rx="195" ry="129" fill="#4a2a8a"/>
    <ellipse cx="558" cy="420" rx="205" ry="129" fill="#a2481f"/>
  </g>

  <!-- the mark (assets/icon.svg) and the name -->
  <g transform="translate(288.8 26) scale(2.6)" stroke="#c9763c" stroke-width="0.9" stroke-linejoin="round">
    <path d="M17.25 10.21L22.05 3.51A1.05 1.05 0 0 0 20.35 2.29L15.55 8.99A1.05 1.05 0 0 0 17.25 10.21Z" fill="#f8ecd8"/>
    <path id="s" d="M3.2 11.4a2.9 2.9 0 1 0 5.8 0a2.9 2.9 0 1 0 -5.8 0zM6.8 9.5a3.7 3.7 0 1 0 7.4 0a3.7 3.7 0 1 0 -7.4 0zM12 11.3a2.9 2.9 0 1 0 5.8 0a2.9 2.9 0 1 0 -5.8 0z" stroke-width="1.8"/>
    <use href="#s" fill="url(#honey)" stroke="none"/>
    <path d="M18.6 12.4H2.4A8.1 7.2 0 0 0 18.6 12.4Z" fill="#f8ecd8"/>
    <path d="M4.6 14.2c0.6 1.6 1.7 2.8 3.2 3.6" fill="none" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>
  </g>
  <text x="320" y="116" text-anchor="middle" fill="#fdf6ec"
    font-family="Inter Variable, Inter, Helvetica, Arial, sans-serif"
    font-size="30" font-weight="600" letter-spacing="-0.8">ambrosia</text>

  <!-- the glass the menu sits on -->
  <rect x="48.5" y="152.5" width="543" height="151" rx="14" fill="url(#pane)" stroke="#fff" stroke-opacity="0.2"/>
</svg>
