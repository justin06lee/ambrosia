LABEL arch
TEXT HELP
Boot the Ambrosia live and install on BIOS.
Try Ambrosia, install it, or repair a system.
ENDTEXT
MENU LABEL Ambrosia live and install (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G %KERNEL_PARAMS%

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Ambrosia live and install on BIOS with speakup screen reader.
Try Ambrosia, install it, or repair a system with speech feedback.
ENDTEXT
MENU LABEL Ambrosia live and install (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G accessibility=on %KERNEL_PARAMS%
