SERIAL 0 115200
UI vesamenu.c32
# The name is in the picture (splash.svg, rendered by tools/build-iso.sh),
# and so is the pane the entries sit on: the screen is 80 columns by 30 rows,
# the pane columns 6 to 73 and rows 10 to 18. The rows below count from VSHIFT.
MENU TITLE
MENU BACKGROUND splash.png

MENU WIDTH 64
MENU HSHIFT 8
MENU MARGIN 2
MENU ROWS 7
MENU VSHIFT 8
MENU TIMEOUTROW 12
MENU TABMSGROW 13
MENU CMDLINEROW 13
MENU HELPMSGROW 16
MENU HELPMSGENDROW 29

# Refer to https://wiki.syslinux.org/wiki/index.php/Comboot/menu.c32
# Warm white on the picture; the chosen entry in honey. No box of syslinux's
# own.
MENU COLOR border       30;44   #00000000 #00000000 none
MENU COLOR title        1;36;44 #00000000 #00000000 none
MENU COLOR sel          7;37;40 #ff2a1426 #fff7bd4a none
MENU COLOR unsel        37;44   #e0fdf6ec #00000000 none
MENU COLOR hotsel       1;7;37;40 #ff2a1426 #fff7bd4a none
MENU COLOR hotkey       1;37;44 #fffdf6ec #00000000 none
MENU COLOR help         37;40   #b0fdf6ec #00000000 none
MENU COLOR timeout_msg  37;40   #80fdf6ec #00000000 none
MENU COLOR timeout      1;37;40 #fff7bd4a #00000000 none
MENU COLOR msg07        37;40   #90fdf6ec #00000000 none
MENU COLOR tabmsg       31;40   #60fdf6ec #00000000 none
MENU COLOR cmdmark      1;36;40 #fff7bd4a #00000000 none
MENU COLOR cmdline      37;40   #e0fdf6ec #00000000 none

MENU CLEAR
MENU IMMEDIATE
