<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Ambrosia's generic audio icon, drawn to match Finder's for a song
       without a cover: a light gray rounded tile under a soft shadow, with
       a beamed pair of eighth notes in a lighter gray. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f4f4"/>
      <stop offset="1" stop-color="#e5e5e5"/>
    </linearGradient>
  </defs>
  <g fill="#000">
    <rect x="7" y="8.5" width="114" height="114" rx="13" opacity="0.035"/>
    <rect x="7.5" y="9" width="113" height="113" rx="12.5" opacity="0.05"/>
    <rect x="8" y="9.5" width="112" height="112" rx="12" opacity="0.07"/>
  </g>
  <rect x="8" y="8" width="112" height="112" rx="12" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="111" height="111" rx="11.5" fill="none" stroke="#fff" stroke-opacity="0.7"/>
  <g fill="#cdcdcd">
    <path d="M52 41.5 88 34v8l-36 7.5z"/>
    <rect x="52" y="41.5" width="5" height="40"/>
    <rect x="83" y="34" width="5" height="40"/>
    <ellipse cx="45" cy="82" rx="11" ry="8.5" transform="rotate(-18 45 82)"/>
    <ellipse cx="76" cy="74.5" rx="11" ry="8.5" transform="rotate(-18 76 74.5)"/>
  </g>
</svg>
